[package]
name = "pricing"
version = "0.1.0"
edition = "2024"


[dependencies]
arb-core = { path = "../core" }
arb-chain = { path = "../chain" }
alloy-primitives = { version = "1.5.2", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
alloy-sol-types = "1.5.2"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5.54", features = ["derive"] }
dotenvy = "0.15"
alloy-provider = { version = "1.5.2", features = ["reqwest", "ws"] }
alloy-rpc-types = "1.5.2"
futures-util = "0.3.31"
url = "2.5.8"
alloy-transport-http = "1.5.2"
alloy-network = "1.5.2"
serde_json = "1.0.149"
rust_decimal = { version = "1.40.0", features = ["maths"] }
rustls = { version = "0.23", features = ["ring"] }
