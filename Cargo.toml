[workspace]
members = ["core", "chain", "pricing", "exchange", "inventory", "integration", "strategy", "executor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Alexander Korzh"]

[workspace.dependencies]
arb-core = { path = "./core" }
arb-chain = { path = "./chain" }
pricing = { path = "./pricing" }
exchange = {path = "./exchange"}
inventory = {path = "./inventory"}
strategy = {path = "./strategy"}
executor ={ path = "./executor" }

alloy = { version = "1.5.2", features = ["full", "signer-local"] }
alloy-primitives = { version = "1.5.4", features = ["serde"] }
alloy-provider = { version = "1.5.2", features = ["reqwest"] }
alloy-rpc-types = "1.5.2"
alloy-transport = "1.5.2"
alloy-transport-http = "1.5.2"
alloy-signer = "1.5.2"
alloy-signer-local = { version = "1.5.2", features = ["keystore"] }
alloy-network = "1.5.2"
alloy-sol-types = "1.5.4"
alloy-consensus = { version = "1.5.2", features = ["serde"] }
alloy-eips = "1.5.2"
alloy-rlp = "0.3.13"

tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
thiserror = "2.0"
anyhow = "1.0"
dotenvy = "0.15"
once_cell = "1.21"
url = "2.5"

rust_decimal = { version = "1.0", features = ["maths"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
rand_08 = { package = "rand", version = "0.8.5" }

clap = { version = "4.5.57", features = ["derive"] }
colored = "3.1"

tempfile = "3.10"
