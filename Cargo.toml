[workspace]
members = ["core", "chain"]
resolver = "2"

[workspace.dependencies]
alloy = { version = "1.5.2", features = ["full", "signer-local"] }
tokio = { version = "1.0", features = ["full"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
dotenvy = "0.15"

arb-core = { path = "./core" }
arb-chain = { path = "./chain" }
