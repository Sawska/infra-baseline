[package]
name = "arb-core"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy-primitives = { version = "1.5.2", features = ["serde"] }
alloy-signer = "1.5.2"
alloy-signer-local = { version = "1.5.2", features = ["keystore"] }
alloy-sol-types = "1.5.2"
alloy-consensus = { version = "1.5.2", features = ["serde"] }

alloy-eips = "1.5.2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
thiserror = "2.0.18"
rust_decimal = "1.33"

rand = "0.9.2"
rand_08 = { package = "rand", version = "0.8.5" }
alloy-rlp = "0.3.12"


[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3.24.0"
