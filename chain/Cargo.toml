[package]
name = "arb-chain"
version = "0.1.0"
edition = "2021"

[dependencies]
arb-core = { path = "../core" }

alloy-primitives = { version = "1.5.2", features = ["serde"] }
alloy-provider = { version = "1.5.2", features = ["reqwest"] }
alloy-rpc-types = "1.5.2"
alloy-transport = "1.5.2"
alloy-transport-http = "1.5.2"
alloy-signer = "1.5.2"
alloy-network = "1.5.2"
alloy-sol-types = "1.5.2"


async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.18"
serde_json = "1.0.149"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rust_decimal = "1.33"
clap = { version = "4.5.54", features = ["derive"] }
chrono = { version = "0.4.43", features = ["serde"] }
anyhow = "1.0"
hex = "0.4"
colored = "3.1.1"
dotenvy = "0.15.7"

[dev-dependencies]
