name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://fake:fake@localhost:5432/fake

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fake
          POSTGRES_PASSWORD: fake
          POSTGRES_DB: fake
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Lint (Clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build Workspace
        run: cargo build --verbose

      - name: Run Database Migrations
        run: |
          cargo install sqlx-cli --no-default-features --features postgres
          sqlx database setup

      - name: Run Anvil and Tests
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          anvil --fork-url "$ETH_RPC_URL" --port 8545 --accounts 10 --balance 10000 > anvil.log 2>&1 &
          echo "Waiting for Anvil to boot..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8545 > /dev/null; then
              echo "Anvil is ready!"
              break
            fi

            if ! kill -0 $! 2>/dev/null; then
              echo "Error: Anvil process died unexpectedly. Logs:"
              cat anvil.log
              exit 1
            fi

            echo "Attempt $i: Still waiting..."
            sleep 1

            if [ $i -eq 30 ]; then
              echo "Timeout: Anvil failed to start in 30s. Logs:"
              cat anvil.log
              exit 1
            fi
          done

          # База готова, Anvil запущен — запускаем тесты всего воркспейса
          cargo test --workspace